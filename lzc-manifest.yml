# Assetizer on LazyCat. One embedded runtime image: web, worker and the optional Notion hook-tunnel.
application:
  subdomain: assetizer
  # The worker produces with nobody looking: start with the box and after an install, and never idle-sleep.
  background_task: true
  routes:
    - /=http://web:8770

services:
  hook-tunnel:
    image: embed:runtime
    binds:
      - /lzcapp/var/assetizer/hook-tunnel:/ingress
    # No proxy environment: the connector goes directly to Cloudflare. It idles without its token file.
    command: sh /lzcapp/pkg/content/scripts/lzc/hook-tunnel.sh
    mem_limit: 128m
    # No network healthcheck: an optional tunnel failure must never hold the whole app behind the gateway.

  web:
    image: embed:runtime
    binds:
      - /lzcapp/var/assetizer:/lzcapp/var/assetizer
    environment: &env
      - ASSETIZER_HOME=/lzcapp/var/assetizer/data
      - ASSETIZER_WHISPER_ROOT=/lzcapp/var/assetizer/models
      - HOME=/lzcapp/var/assetizer/home
      - ASSETIZER_AGY=/lzcapp/var/assetizer/home/.local/bin/agy
      - ASSETIZER_YTDLP=/usr/local/bin/yt-dlp
      - ASSETIZER_DENO=/usr/local/bin/deno
      - ASSETIZER_RCLONE=/usr/local/bin/rclone
      - ASSETIZER_PORT=8770
      - ASSETIZER_TRUST_LAZYCAT=1
      - PYTHONPATH=/lzcapp/pkg/content/src
      - TZ=Asia/Shanghai
      # Outbound through the box's pinned container proxy: always the DMIT EB Fast node, whatever the user picks
      # for PROXY (Clash-Verge-For-LC, docs/CONTAINER_PROXY_GUIDE.md).
      - HTTP_PROXY=http://172.18.0.1:17896
      - HTTPS_PROXY=http://172.18.0.1:17896
      - http_proxy=http://172.18.0.1:17896
      - https_proxy=http://172.18.0.1:17896
      - NO_PROXY=localhost,127.0.0.1,::1,web,worker,.heiyu.space,.lazycat.cloud,172.18.0.1
      - no_proxy=localhost,127.0.0.1,::1,web,worker,.heiyu.space,.lazycat.cloud,172.18.0.1
    command: sh /lzcapp/pkg/content/scripts/lzc/start.sh web
    # besides the API: compiles (agy calls), the 机房 page's agy sign-in (agy's own interface, ~200 MB) and quota reads,
    # yt-dlp listings for 补录. Over the limit the kernel kills inside this container, and the gateway then holds the app.
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: embed:runtime
    binds:
      - /lzcapp/var/assetizer:/lzcapp/var/assetizer
    environment: *env
    command: sh /lzcapp/pkg/content/scripts/lzc/start.sh worker
    # Per run: whisper (child process, ~2.5 GB) + agy calls + ffmpeg, measured peak 4.4 GB on a 29-minute video; three
    # runs at once peaked at 5.4 GB (their whisper phases did not overlap). The setting `worker_slots` (per box, default
    # 1) runs that many at once; 32 GB leaves prodbox (46 GB, ~10 GB for its other apps) room for 8 whisper
    # children starting together. Above it the kernel kills inside this container only. No CPU cap: a cap above the
    # box's core count fails to start (devbox has 8, prodbox 16), and parallel runs should use them all.
    mem_limit: 32g
    # LazyCat holds the whole app behind its gateway while any service is unhealthy, so this only checks that the
    # worker process is alive (its heartbeat thread), never that a run makes progress: a run blocks the loop for hours.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, sys, time; p = '/lzcapp/var/assetizer/data/run/worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 300 else 1)"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
