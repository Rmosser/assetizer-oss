[project]
name = "assetizer"
version = "0.1.0"
description = "课代表 — long videos to Knowledge Units, clips, Notion and publication packages"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "jieba>=0.42",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
# numpy: the ASR tests build synthetic audio; opencc: subtitles to simplified Chinese; pillow: frames and thumbnails
dev = ["pytest>=8", "numpy", "opencc-python-reimplemented", "pillow"]

[project.scripts]
assetizer = "assetizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetizer = ["contracts/*.json", "contracts/*.md", "topics/prompts/*.md", "web/static/**/*"]
